# Local profile: Postgres from docker-compose.yml (container crochet-postgres), published on
# host port 5433 because a native Postgres already listens on 5432.
# Run with: docker compose up -d, then SPRING_PROFILES_ACTIVE=local
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/crochet}
    username: ${DB_USERNAME:crochet}
    password: ${DB_PASSWORD:crochet}

server:
  servlet:
    session:
      cookie:
        # plain HTTP locally
        secure: false
