spring:
  application:
    name: crochet_back
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crochet}
    username: ${DB_USERNAME:crochet}
    password: ${DB_PASSWORD:crochet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never

crochet:
  cors:
    allowed-origins:
      - http://localhost:5173
