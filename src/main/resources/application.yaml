spring:
  application:
    name: crochet_back
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never

crochet:
  login-limit:
    max-failures-per-email-and-client: 5
    max-failures-per-email: 50
    email-window: 15m
    max-requests-per-ip: 20
    ip-window: 1m
  cors:
    allowed-origins:
      - http://localhost:5173

server:
  # behind a TLS-terminating reverse proxy: trust its X-Forwarded-* headers (only from private
  # network addresses) for the client IP and scheme
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # also applied to the XSRF-TOKEN cookie; set SESSION_COOKIE_SECURE=false for local HTTP
        secure: ${SESSION_COOKIE_SECURE:true}
