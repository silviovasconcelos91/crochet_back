# Loaded on top of the main application.yaml. Every MockMvc request comes from 127.0.0.1 and the
# login counters live as long as the cached Spring context, so the suite would trip the production
# limits; LoginRateLimitApiTests sets its own low limits.
crochet:
  login-limit:
    max-failures-per-email-and-client: 1000
    max-failures-per-email: 1000
    max-requests-per-ip: 100000

# lets repository tests count the SQL statements a load issues
spring:
  jpa:
    properties:
      hibernate:
        generate_statistics: true
logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: warn

# pinned to the shipped default so the cookie tests do not depend on a local SESSION_COOKIE_SECURE
server:
  servlet:
    session:
      cookie:
        secure: true
